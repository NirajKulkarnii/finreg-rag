[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    asyncio: async test
    slow: tests that require real model loading (skip with -m "not slow")
    integration: tests that require running services (ChromaDB, vLLM)
